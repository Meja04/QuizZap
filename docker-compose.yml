version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: quizzap-db
    environment:
      MYSQL_DATABASE: quizzap
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - quizzap-network
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-prootpassword",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: quizzap-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/quizzap?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - quizzap-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: quizzap-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - quizzap-network
    restart: unless-stopped

volumes:
  mysql_data:

networks:
  quizzap-network:
    driver: bridge
