spring.application.name=backend

# In Docker: usa variabili d'ambiente (MySQL container)
# In locale: usa localhost MySQL
# Sintassi: ${VARIABILE:default} key dev'essere uguale al file compose, altrimenti usa defualt
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/quiz-zap-fullstack}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=admin
spring.rabbitmq.password=rabbitpwd

app.queue.quizzap.name=quizzap_rabbit_queue
app.exchange.quizzap.name=quizzap_rabbit_exchange
app.routing.quizzap.key=quizzap_routing_key

